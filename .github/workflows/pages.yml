name: Deploy GitHub Pages

# Publica o protótipo web (dados simulados) a cada push em develop.
# Requer Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
      # O export é uma página única: o Pages devolve 404 em rotas como /painel.
      # Servir o index.html como 404.html faz o app abrir e resolver a rota.
      - run: cp dist/index.html dist/404.html
      # O Expo gera arquivos iniciados por "_" (pasta _expo), que o Jekyll ignora.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
